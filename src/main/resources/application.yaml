spring:
  application:
    name: petmatch-lab

  datasource:
    url: jdbc:mariadb://localhost:3307/petmatch_lab
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

server:
  port: 8080